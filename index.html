<body>
<div id="app"></div>
<script>
const CID_DEFAULT = "484812261158-a37b9kuotiv8ctj2b3fb8n0mfc9fjdg3.apps.googleusercontent.com";
const SCOPE = "https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const getCid = () => CID_DEFAULT || localStorage.csk_cid || "";
const CLOUD_DEFAULT = "https://csk-mail.vnucsk.workers.dev";
const getCloud = () => (CLOUD_DEFAULT || localStorage.csk_cloud || "").replace(/\/+$/, "");
let U, D, TOK, EXP = 0, client, tab = "contacts", RUN = 0, STOP = 0, cur = {list: "", cid: "", edit: null}, IMG = {}, RT = null, RG = null;
/* ---------- Lưu dữ liệu trong trình duyệt theo tài khoản Google ---------- */
const DEF = () => ({contacts: [], camps: [], sent: [], set: {batch: 150, delay: 3, cap: 2000, gap: 5, mask: true, lock: 15}});
let ST, FQ = Promise.resolve(), LASTACT = Date.now();
const dkey = () => "csk3:" + U.email;
const b2s = b => { let s = ""; const a = new Uint8Array(b); for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
const s2b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const flush = () => FQ = FQ.then(async () => {
  if (!D || !U) return;
  localStorage[dkey()] = JSON.stringify(D);
}).catch(e => console.error(e));
const save = () => { clearTimeout(ST); ST = setTimeout(flush, 250); };
function setD(o) {
  D = Object.assign(DEF(), o); D.set = Object.assign(DEF().set, o.set || {}); delete D.track; delete D.last;
  D.sent.forEach(x => { delete x.open; delete x.opens; delete x.clicks; delete x.tok; });
  D.camps.forEach(fix);
}
const E = () => cur.edit;
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());

/* ---------- Kho ảnh/tệp (IndexedDB) ---------- */
const idb = new Promise(r => { const q = indexedDB.open("csk", 1); q.onupgradeneeded = () => q.result.createObjectStore("f"); q.onsuccess = () => r(q.result); });
let FK = null; // chỉ để đọc các tệp cũ đã mã hóa
async function initFK() { FK = D.fk ? await crypto.subtle.importKey("raw", s2b(D.fk), "AES-GCM", false, ["decrypt"]) : null; }
const fput = async (k, v) => { const d = await idb; return new Promise(r => { const t = d.transaction("f", "readwrite"); t.objectStore("f").put(v, k); t.oncomplete = r; }); };
const fget = async k => {
  const d = await idb, r = await new Promise(res => { const q = d.transaction("f").objectStore("f").get(k); q.onsuccess = () => res(q.result); });
  if (r && r.enc) { try { return {blob: new Blob([await crypto.subtle.decrypt({name: "AES-GCM", iv: r.iv}, FK, r.ct)], {type: r.type}), type: r.type, name: r.name}; } catch (e) { return undefined; } }
  return r;
};
async function loadImg(id) { const r = await fget(id); if (r) IMG[id] = {url: URL.createObjectURL(r.blob), name: r.name}; }
const preload = async c => { for (const b of c.blocks) if (b.t == "img" && b.v && !IMG[b.v]) await loadImg(b.v); };

/* ---------- Đăng nhập Google ---------- */
function loginView() {
  if (!getCid()) return `<div class=login><div class=card><h2>Thiết lập lần đầu</h2>
    <p>Dán <b>OAuth Client ID</b> của Google.</p>
    <input id=cid style="width:100%" placeholder="xxxx.apps.googleusercontent.com"><p><button onclick="localStorage.csk_cid=$('#cid').value.trim();boot()">Lưu</button></p></div></div>`;
  return `<div class=login><div class=card><h2>Mail CSK</h2><p>Gửi mail hàng loạt từ tài khoản Google của bạn.</p>
    <button onclick=login() style="display:inline-flex;align-items:center;gap:10px;padding:10px 20px;background:#fff;color:#3c4043;border:1px solid #dadce0;border-radius:24px;font-weight:500">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.6 5.900c4.400-4.100 6.900-10.100 6.900-17.600z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.100 15.900-5.800l-7.600-5.900c-2.100 1.400-4.900 2.300-8.300 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>
    Đăng nhập bằng Google</button></div></div>`;
}
function getTok(prompt = "") {
  return new Promise((res, rej) => {
    if (TOK && Date.now() < EXP - 60000) return res(TOK);
    client.callback = r => { if (r.error) return rej(new Error(r.error_description || r.error)); TOK = r.access_token; EXP = Date.now() + r.expires_in * 1000; res(TOK); };
    client.error_callback = e => rej(new Error(e.type || "Cửa sổ đăng nhập bị chặn"));
    client.requestAccessToken({prompt});
  });
}
async function login() {
  if (!window.google) return alert("Google chưa tải xong, thử lại sau vài giây.");
  client = google.accounts.oauth2.initTokenClient({client_id: getCid(), scope: SCOPE, callback: () => {}});
  try {
    await getTok("select_account");
    const p = await (await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {headers: {Authorization: "Bearer " + TOK}})).json();
    U = {email: p.email, name: p.name || p.email};
    try { await cfetch("GET"); }
    catch (e) {
      const T = TOK; TOK = null; EXP = 0; U = null; try { google.accounts.oauth2.revoke(T); } catch (x) {}
      boot();
      return alert(e.denied ? `Tài khoản ${p.email} chưa được cấp phép sử dụng. Vui lòng liên hệ quản trị viên để được thêm vào danh sách.` : "Không kiểm tra được quyền đăng nhập (" + (e.message || e) + "). Thử lại sau.");
    }
    await loadLocal();
  } catch (e) { alert("Đăng nhập lỗi: " + e.message); }
}
async function loadLocal() {
  let o = {}; try { o = JSON.parse(localStorage[dkey()] || "null") || JSON.parse(localStorage["csk:" + U.email] || "{}"); } catch (e) {}
  setD(o); await initFK(); await flush(); cur.edit = null; shell();
}
async function logout() { if (RUN) return alert("Đang gửi, hãy dừng trước."); clearTimeout(ST); await flush(); D = null; FK = null; TOK = null; EXP = 0; U = null; boot(); }
async function wipeFiles() { const d = await idb; await new Promise(r => { const t = d.transaction("f", "readwrite"); t.objectStore("f").clear(); t.oncomplete = r; }); IMG = {}; }
async function wipeAll() {
  if (RUN) return alert("Đang gửi, hãy dừng trước.");
  if (prompt("Xóa liên hệ, thư, lịch sử và tệp lưu trên máy này (danh sách trên Kho chung không bị xóa). Gõ XOA để xác nhận:") !== "XOA") return;
  clearTimeout(ST); delete localStorage[dkey()]; delete localStorage["csk2:" + U.email]; delete localStorage["csk:" + U.email]; await wipeFiles(); D = null; FK = null; TOK = null; EXP = 0; U = null; boot();
}
function boot() { $("#app").innerHTML = loginView(); }

/* ---------- Khung chính ---------- */
function shell() {
  $("#app").innerHTML = `<aside><h1>Mail CSK</h1><a data-t=contacts>👥 Liên hệ</a><a data-t=camps>✏️ Soạn thư</a><a data-t=tpl>🎨 Mẫu thiết kế</a><a data-t=history>🕘 Lịch sử</a><a data-t=set>⚙️ Cài đặt</a>
    <div id=tbx>${TB}</div>
    <div class=me>${esc(U.name)}<br>${esc(U.email)}<br><a href="#" onclick="logout();return false" style="padding:0;display:inline;color:#ffe01b">Đăng xuất</a></div></aside><main id=v></main>`;
  document.querySelectorAll("aside a[data-t]").forEach(a => a.onclick = () => go(a.dataset.t));
  go("contacts"); cloudSync();
}
function go(t) {
  tab = t || tab; RT = null;
  document.querySelectorAll("aside a[data-t]").forEach(a => a.className = (a.dataset.t == tab || (tab == "edit" && a.dataset.t == "camps")) ? "on" : "");
  $("#v").innerHTML = {contacts: vContacts, camps: vCamps, tpl: vTpl, edit: vEdit, history: vHist, set: vSet}[tab]();
  $("#tbx").style.display = (tab == "edit" && cur.edit) ? "block" : "none";
  if (cur.edit && tab == "edit") { upd(true); if (cur.edit.who == "pick") refPick(); }
}

/* ---------- Liên hệ ---------- */
const lists = () => [...new Set(D.contacts.map(c => c.list))];
const mk = e => D.set.mask === false ? e : String(e).replace(/^(.{1,2}).*(@.*)$/, "$1•••$2");
function vContacts() {
  const r = D.contacts.filter(c => !cur.list || c.list == cur.list);
  return `<h2>Liên hệ</h2>${cloudBar()}<div class=card><b>Nhập từ Excel/CSV</b> <span class=m>(mỗi dòng có 1 email, tên nếu có để ở ô bên cạnh). File chỉ được đọc ngay trong trình duyệt, không tải lên máy chủ nào.</span><br>
    <input id=ln placeholder="Tên danh sách" value="${esc(cur.list || "Chung")}"> <input type=file id=fi accept=".xlsx,.xls,.csv"> <button onclick=imp()>Nhập</button></div>
    <select onchange="cur.list=this.value;go()"><option value="">Tất cả (${D.contacts.length})</option>${lists().map(l => `<option value="${esc(l)}" ${l == cur.list ? "selected" : ""}>${esc(l)} (${D.contacts.filter(c => c.list == l).length})</option>`).join("")}</select>
    ${cur.list ? `<button class=g onclick=delList()>Xóa danh sách này</button>` : ""}
    <p class=m>Hiển thị tối đa 300 dòng${D.set.mask === false ? "" : "; email được ẩn một phần (đổi trong Cài đặt)"}.</p><table><tr><th>Email<th>Tên<th>Danh sách<th>Trạng thái<th></tr>
    ${r.slice(0, 300).map(c => `<tr><td>${esc(mk(c.email))}<td>${esc(c.name)}<td>${esc(c.list)}<td>${c.unsub ? "Đã hủy đăng ký" : "Đang nhận"}
    <td><button class=g onclick="tg('${c.id}')">${c.unsub ? "Khôi phục" : "Hủy đăng ký"}</button></tr>`).join("")}</table>`;
}
/* ---------- Kho chung Cloudflare ---------- */
let CSTAT = "", CBUSY = 0, CT;
const CST = t => { CSTAT = t; const e = $("#cst"); if (e) e.textContent = t; };
const cloudBar = () => getCloud() ? `<div class=card style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class=g onclick="cloudSync(1)">☁️ Đồng bộ ngay</button><span class=m id=cst>${esc(CSTAT)}</span></div>` : "";
const csync = () => { if (!getCloud()) return; clearTimeout(CT); CT = setTimeout(() => cloudSync(), 1500); };
const slim = () => D.contacts.map(({email, name, list, unsub, u}) => ({email, name: name || "", list, ...(unsub ? {unsub: true} : {}), u: u || 0}));
const norm = a => JSON.stringify((a || []).map(({email, name, list, unsub, u}) => [list, email, name || "", unsub ? 1 : 0, u || 0]).sort((x, y) => (x[0] + "|" + x[1]).localeCompare(y[0] + "|" + y[1])));
function mergeIn(R) {
  const m = new Map();
  for (const c of [...D.contacts, ...(R.contacts || [])]) {
    const k = c.list + "|" + c.email, o = m.get(k);
    if (!o || (c.u || 0) > (o.u || 0)) m.set(k, {...c, id: o?.id || c.id || uid()});
  }
  const del = {...(D.del || {})}; for (const [l, t] of Object.entries(R.del || {})) del[l] = Math.max(del[l] || 0, t);
  D.del = del; D.contacts = [...m.values()].filter(c => !(del[c.list] && (c.u || 0) <= del[c.list]));
}
async function cfetch(method, body) {
  const t = await getTok();
  const r = await fetch(getCloud() + "/contacts", {method, headers: {Authorization: "Bearer " + t, ...(body ? {"Content-Type": "application/json"} : {})}, body: body ? JSON.stringify(body) : undefined});
  if (r.status == 409) return {conflict: true, data: await r.json()};
  if (r.status == 403 || r.status == 401) { const er = new Error("tài khoản này chưa được cấp quyền truy cập Kho chung."); er.denied = 1; throw er; }
  if (!r.ok) throw new Error("lỗi máy chủ (" + r.status + ")");
  return {data: await r.json()};
}
async function cloudSync(manual) {
  if (!getCloud() || !D || CBUSY) return; CBUSY = 1; CST("Đang đồng bộ...");
  try {
    let r = await cfetch("GET"), R = r.data; const n0 = D.contacts.length;
    mergeIn(R); D.rev = R.rev || 0;
    for (let i = 0; i < 3; i++) {
      if (norm(D.contacts) == norm(R.contacts) && JSON.stringify(D.del || {}) == JSON.stringify(R.del || {})) break;
      r = await cfetch("PUT", {contacts: slim(), del: D.del || {}, rev: D.rev});
      if (!r.conflict) { D.rev = r.data.rev; break; }
      R = r.data; mergeIn(R); D.rev = R.rev || 0;
    }
    save(); CST(`Đã đồng bộ ${D.contacts.length} liên hệ lúc ${new Date().toLocaleTimeString("vi")}.`);
    if (tab == "contacts" && (manual || D.contacts.length != n0)) go();
  } catch (e) { CST("Chưa đồng bộ được: " + (e.message || e)); }
  CBUSY = 0;
}
function tg(id) { const c = D.contacts.find(x => x.id == id); c.unsub = !c.unsub; c.u = Date.now(); save(); csync(); go(); }
function delList() {
  if (!cur.list || !confirm(`Xóa toàn bộ danh sách "${cur.list}" (${D.contacts.filter(c => c.list == cur.list).length} email)?`)) return;
  (D.del ||= {})[cur.list] = Date.now(); D.contacts = D.contacts.filter(c => c.list != cur.list); cur.list = ""; save(); csync(); go();
}
async function importFile(f, list) {
  const wb = f.name.toLowerCase().endsWith(".csv") ? XLSX.read(await f.text(), {type: "string"}) : XLSX.read(await f.arrayBuffer());
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, raw: false});
  const have = new Set(D.contacts.filter(c => c.list == list).map(c => c.email)), okName = x => x && !x.includes("@") && !/^\d+$/.test(x);
  let add = 0, dup = 0, bad = 0;
  for (const r of rows) {
    const cells = (r || []).map(x => String(x ?? "").trim()), j = cells.findIndex(x => isMail(x.toLowerCase()));
    if (j < 0) { if (cells.some(x => x.includes("@"))) bad++; continue; }
    const e = cells[j].toLowerCase(), name = cells.slice(j + 1).find(okName) || cells.slice(0, j).find(okName) || "";
    if (have.has(e)) { dup++; continue; }
    have.add(e); D.contacts.push({id: uid(), email: e, name, list, u: Date.now()}); add++;
  }
  return {add, dup, bad};
}
async function imp() {
  const f = $("#fi").files[0], list = $("#ln").value.trim() || "Chung";
  if (!f) return alert("Chọn file trước.");
  const r = await importFile(f, list); save(); csync(); cur.list = list; alert(`Đã thêm ${r.add}, trùng ${r.dup}, email sai ${r.bad}.`); go();
}
async function impQuick() {
  const f = $("#qf").files[0]; if (!f) return alert("Chọn file Excel/CSV trước.");
  const list = f.name.replace(/\.[^.]+$/, "").slice(0, 40) || "Danh sách";
  const r = await importFile(f, list); E().list = list; save(); csync(); alert(`Danh sách "${list}": thêm ${r.add}, trùng ${r.dup}, email sai ${r.bad}.`); go();
}

  const s = getSelection(); if (!s.rangeCount) return;
  const n = s.anchorNode?.nodeType == 3 ? s.anchorNode.parentElement : s.anchorNode, rt = n?.closest?.(".rt");
  if (rt) { RT = rt; RG = s.getRangeAt(0).cloneRange(); }
});
function fc(cmd, val) {
  if (!RT || !RT.isConnected) return alert("Bấm vào một khối văn bản và bôi đen chữ cần định dạng trước.");
  if ((cmd == "fontName" || cmd == "size") && !val) return;
  RT.focus(); const s = getSelection(); s.removeAllRanges(); s.addRange(RG);
  document.execCommand("styleWithCSS", false, cmd != "size");
  if (cmd == "size") {
    document.execCommand("fontSize", false, 7);
    RT.querySelectorAll('font[size="7"]').forEach(f => { const sp = document.createElement("span"); sp.style.fontSize = val + "px"; sp.innerHTML = f.innerHTML; f.replaceWith(sp); });
  } else if (cmd == "createLink") { val = prompt("Dán link (https://...)"); if (!val) return; document.execCommand(cmd, false, val); }
  else document.execCommand(cmd, false, val);
  E().blocks[+RT.dataset.i].v = RT.innerHTML; upd();
}

let LK = null;
function lk() {
  if (!RT || !RT.isConnected || !RG) return alert("Bấm vào khối văn bản trước. Bôi đen chữ cần gắn link (ví dụ \"tại đây\"), hoặc đặt con trỏ vào nơi muốn chèn.");
  const rg = RG.cloneRange(), sel = rg.toString(), n = rg.commonAncestorContainer, el = n.nodeType == 3 ? n.parentElement : n, a = el.closest?.("a");
  LK = {rg, sel, a: a && RT.contains(a) ? a : null, rt: RT};

  d.style.cssText = "position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:center;justify-content:center";
  d.innerHTML = `<div class=card style="width:min(420px,92vw);margin:0"><b>Gắn link vào chữ</b><br>
    <span class=m>Chữ hiển thị (ví dụ: tại đây)</span><br><input id=lkt style="width:100%" value="${esc(LK.a ? LK.a.textContent : sel) || "tại đây"}">
    <br><span class=m>Link sẽ mở khi bấm vào chữ</span><br><input id=lku style="width:100%" placeholder="https://..." value="${esc(LK.a ? LK.a.getAttribute("href") : "")}" onkeydown="if(event.key=='Enter')lkOk()">
    <p><button onclick=lkOk()>Áp dụng</button> <button class=g onclick="$('#lkm').remove()">Hủy</button></p></div>`;
  document.body.appendChild(d); (sel || LK.a ? $("#lku") : $("#lkt")).focus();
}
function lkOk() {
  let u = $("#lku").value.trim(), t = $("#lkt").value.trim();
  if (!u) return alert("Nhập link cần gắn.");
  if (!/^(https?:|mailto:|tel:)/i.test(u)) u = /^[^@\s\/]+@[^@\s\/]+$/.test(u) ? "mailto:" + u : "https://" + u.replace(/^\/+/, "");
  $("#lkm").remove();
  const {rg, sel, a, rt} = LK; t ||= u;
  rt.focus(); const s = getSelection(); s.removeAllRanges(); s.addRange(rg);
  const css = "color:#1a0dab;text-decoration:underline";
  if (a) { a.setAttribute("href", u); a.setAttribute("style", css); if (t != a.textContent) a.textContent = t; }
  else if (sel && t == sel) { document.execCommand("createLink", false, u); rt.querySelectorAll("a:not([style])").forEach(x => x.setAttribute("style", css)); }
  else document.execCommand("insertHTML", false, `<a href="${esc(u)}" style="${css}">${esc(t)}</a>&nbsp;`);

}

  if (!todo.length) return alert(all.length ? "Hôm nay đã hết hạn mức gửi." : c.who == "pick" ? "Chưa chọn ai, hoặc những người đã chọn đều đã nhận thư này rồi." : "Không còn ai để gửi.");
  const units = []; for (let k = 0; k < todo.length; k += G) units.push(todo.slice(k, k + G));
  if (!confirm(`Gửi thư "${c.name}" cho ${todo.length} người${c.who == "pick" ? " đã chọn" : ""}, chia thành ${units.length} thư${one ? " (mỗi người một thư riêng)" : ` (${mode == "bcc" ? "BCC" : "CC"}, tối đa ${G} người/thư)`}?`)) return;
  const ccL = mails(c.cc), bccL = mails(c.bcc), per = one ? Math.max(1, D.set.batch) : 1;
  RUN = 1; STOP = 0; LOG = []; let fails = 0;
  say(`Còn ${all.length} người chưa gửi. Hôm nay còn được gửi ${room} người. Sẽ gửi ${units.length} thư.`);
  try {
    const A = await assets(c);
    for (let n = 0; n < units.length && !STOP && fails < 5; n++) {
      const u = units[n], [s, h] = personal(c, one ? u[0] : {name: ""}), em = u.map(x => x.email);
      const to = one ? `${u[0].name ? hdr(u[0].name) + " " : ""}<${u[0].email}>` : `<${U.email}>`;
      const me = U.email.toLowerCase(), cc = [...new Set([...(mode == "cc" ? em : []), ...ccL])].filter(x => one || x.toLowerCase() != me), bcc = [...new Set([...(mode == "bcc" ? em : []), ...bccL])].filter(x => one || x.toLowerCase() != me);
      let ok = 1, err = "";
      try { await gsend(mime(to, s, h, A, cc, bcc)); fails = 0; } catch (e) { ok = 0; err = e.message; say(`Lỗi ${one ? em[0] : "thư " + (n + 1) + " (" + em.length + " người)"}: ${err}`); fails++; }
      const at = new Date().toLocaleString("sv"), batch = one ? Math.floor(n / per) + 1 : n + 1;
      u.forEach(x => D.sent.push({cid: id, email: x.email, name: x.name, at, batch, ok, ...(ok ? {} : {err}), ...(one ? {} : {grp: 1})}));
      save(); if (tab == "camps") go(); if (tab == "edit") refSend();
      if (ok) say(one ? `Đã gửi ${n + 1}/${units.length}.` : `Đã gửi thư ${n + 1}/${units.length} (${em.length} người).`);
      if (fails >= 5) { say("Lỗi liên tiếp 5 lần, dừng lại."); break; }
      if (n + 1 < units.length && !STOP) {
        if (one && (n + 1) % per == 0) { say(`Nghỉ ${D.set.delay} phút...`); for (let k = 0; k < D.set.delay * 60 && !STOP; k++) await sleep(1000); }
        else await sleep(one ? 1000 : Math.max(1, D.set.gap) * 1000);
      }
    }
  } catch (e) { say("LỖI: " + e.message); }
  say(STOP ? "Đã dừng." : "Hoàn tất lượt gửi. Nếu còn người chưa gửi, bấm Gửi / Tiếp tục.");
  RUN = 0; if (tab == "camps") go(); if (tab == "edit") refSend();
}

/* ---------- Lịch sử ---------- */
function vHist() {
  const r = D.sent.filter(s => !cur.cid || s.cid == cur.cid).slice().reverse();
  const nm = id => D.camps.find(c => c.id == id)?.name || "(đã xóa)";
  return `<h2>Lịch sử</h2><div class=card><select onchange="cur.cid=this.value;go()"><option value="">Tất cả thư</option>${D.camps.map(c => `<option value=${c.id} ${c.id == cur.cid ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
    <button class=g onclick=exp()>Xuất Excel</button>
    <div class=m>Hiển thị 500 dòng mới nhất; file Excel có toàn bộ (email đầy đủ).</div></div>
    <table><tr><th>Email<th>Tên<th>Thư<th>Trạng thái<th>Thời gian gửi<th>Thư số</tr>${r.slice(0, 500).map(s => `<tr><td>${esc(mk(s.email))}<td>${esc(s.name)}<td>${esc(nm(s.cid))}
    <td>${s.ok ? "Đã gửi" : "Lỗi: " + esc(s.err)}<td>${esc(s.at)}<td>${s.batch}</tr>`).join("")}</table>`;
}
function exp() {
  const nm = id => D.camps.find(c => c.id == id)?.name || "(đã xóa)";
  const rows = D.sent.map(s => ({"Thư": nm(s.cid), Email: s.email, "Tên": s.name, "Trạng thái": s.ok ? "Đã gửi" : "Lỗi", "Lỗi": s.err || "", "Thời gian gửi": s.at, "Thư số": s.batch}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Lịch sử"); XLSX.writeFile(wb, "lich_su_gui_mail.xlsx");
}
/* Tự đồng bộ Kho chung, lưu khi rời trang, cảnh báo khi đang gửi */
const canAuto = () => D && !RUN && !document.hidden && getCloud() && TOK && Date.now() < EXP - 60000;
setInterval(() => { if (canAuto()) cloudSync(); }, 120000);
addEventListener("pagehide", () => { clearTimeout(ST); flush(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { clearTimeout(ST); flush(); } else if (canAuto()) cloudSync(); });
addEventListener("beforeunload", e => { if (RUN) { e.preventDefault(); e.returnValue = ""; } });
boot();
</script>
